# Каждую ночь: резервная копия базы и заодно «будим» бесплатный Supabase.
# По понедельникам копия уходит владельцам на почту. В GitHub копия не выкладывается: репозиторий публичный,
# а в копии есть почты и имена людей.
name: Ночная копия базы
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mail:
        description: 'Отправить копию владельцам на почту сейчас'
        type: boolean
        default: true
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Копия владельцам на почту (по понедельникам или вручную)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$MANUAL" = "true" ]; then npx tsx scripts/mail-backup.ts; else echo "Не понедельник — письмо не отправляю."; fi
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.mail }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
